<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taniti Tourism - Booking</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page-wrapper">

    <header class="main-header">
      <h1>Taniti Tourism</h1>
    </header>

    <nav class="main-navigation">
      <a href="index.html">Home</a>
      <a href="lodging.html">Lodging</a>
      <a href="transportation.html">Transportation</a>
      <a href="food.html">Food</a>
      <a href="activities.html">Activities</a>
      <a href="booking.html" class="active">Book Now</a>
    </nav>

    <main class="main-content">

      <section class="page-title-section">
        <h2>Book Your Trip</h2>
        <p>
          Complete the form below to request more information about planning your visit to Taniti.
        </p>
      </section>

      <section class="booking-form-section">
        <form class="booking-form" action="#" method="post">

          <label for="name">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Enter your name"
            required
          >

          <label for="phone">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="Enter your phone number"
            required
          >

          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email address"
            required
          >

          <button type="submit">Submit</button>

        </form>
      </section>

    </main>

    <footer class="main-footer">
      <p>Copyright &copy; 2023 Taniti Tourism. All rights reserved.</p>
    </footer>

  </div>
</body>
</html>
